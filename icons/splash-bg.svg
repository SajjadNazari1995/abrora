<style>
 .tw1{animation:tw 3.2s ease-in-out infinite} .tw2{animation:tw 4.6s ease-in-out -1.4s infinite} .tw3{animation:tw 2.4s ease-in-out -.7s infinite}
 @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
 .sway1{animation:sw1 14s ease-in-out infinite alternate} .sway2{animation:sw2 18s ease-in-out infinite alternate} .sway3{animation:sw3 22s ease-in-out infinite alternate}
