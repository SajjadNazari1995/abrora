 .ray{animation:ray 7s ease-in-out infinite alternate;opacity:.25}
 @keyframes ray{0%{opacity:.08;transform:translateX(-24px)}100%{opacity:.5;transform:translateX(30px)}}
 .c1{animation:cd1 40s linear infinite alternate} .c2{animation:cd2 54s linear infinite alternate} .c3{animation:cd3 70s linear infinite alternate}
 @keyframes cd1{to{transform:translateX(-110px)}} @keyframes cd2{to{transform:translateX(90px)}} @keyframes cd3{to{transform:translateX(-60px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
