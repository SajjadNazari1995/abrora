<style>
/* Opening screen (shown instantly, before any script runs) */
html.splashing, html.splashing body { background: #070522; overflow: hidden; }
#splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden;
  background: #7d5bd6 url("icons/splash-clouds.svg") center / cover no-repeat;
  transition: opacity .7s ease, transform .9s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .9s; }
#splash[data-brand="aurora"] { background: #0d4a4a url("icons/splash-aurora.svg") center / cover no-repeat; }
#splash[data-brand="abrora"] { background: #2b5a86 url("icons/splash-abrora.svg") center / cover no-repeat; }
#splash.out { opacity: 0; transform: scale(1.06); visibility: hidden; pointer-events: none; }
#splash .sp-center { display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: -4vh; }
#splash .sp-logo { position: relative; width: 148px; height: 148px; animation: spPop .9s cubic-bezier(.2, 1.2, .3, 1) both, spFloat 5s ease-in-out 1s infinite; }
#splash .sp-logo::before { content: ""; position: absolute; inset: -34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 170, 220, .55), rgba(150, 120, 255, .25) 55%, transparent); animation: spPulse 3.2s ease-in-out infinite; }
#splash .sp-logo img { position: relative; width: 100%; height: 100%; border-radius: 38px; display: block; box-shadow: 0 18px 50px rgba(20, 8, 70, .55), 0 0 0 1.5px rgba(255, 255, 255, .28); }
#splash .sp-name { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 48px; letter-spacing: .5px; line-height: 1.2; color: #fff; direction: ltr;
  text-shadow: 0 2px 22px rgba(255, 150, 215, .65), 0 0 2px rgba(255, 255, 255, .6); animation: spName 1s cubic-bezier(.2, .8, .2, 1) .35s both; }
#splash .sp-tag { font-family: "Vazir", system-ui, -apple-system, "Geeza Pro", sans-serif; font-size: 17px; color: rgba(255,255,255,.9); margin-top: -14px; text-align: center; padding: 0 28px; animation: spName 1s cubic-bezier(.2, .8, .2, 1) .6s both; }
@keyframes spPop { from { opacity: 0; transform: scale(.55) translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes spFloat { 50% { transform: translateY(-9px); } }
@keyframes spPulse { 50% { transform: scale(1.12); opacity: .75; } }
@keyframes spName { from { opacity: 0; transform: translateY(14px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { #splash .sp-logo, #splash .sp-logo::before, #splash .sp-name { animation: none; } }
</style>
<script>
/* Apply the last chosen language, theme and look before first paint, so the opening screen shows in the language
   the person last picked (V2). Only non-health preferences are read here; health data stays in the encrypted store. */
(function () {
  var TAG = { fa: 'همراه خصوصی چرخه‌ی تو', en: 'Your private cycle companion', de: 'Deine private Zyklus-Begleiterin' };
  var NAME = { abra: 'Abra', aurora: 'Aurora', abrora: 'Abrora' };
  var h = document.documentElement, p = {};
  try { p = JSON.parse(localStorage.getItem('abra:prefs') || '{}') || {}; } catch (e) { }
  if (!p.lang) { try { p = { lang: ((JSON.parse(localStorage.getItem('abrora:v1') || '{}') || {}).settings || {}).lang }; } catch (e) { } }   // first launch after upgrading
  var l = ['fa', 'en', 'de'].indexOf(p.lang) >= 0 ? p.lang : 'en';
  h.lang = l; h.dir = l === 'fa' ? 'rtl' : 'ltr';
  if (p.font === 'iransans') h.setAttribute('data-font', 'iransans');
  if (p.skin === 'glass') h.setAttribute('data-skin', 'glass');
  var br = NAME[p.brand] ? p.brand : 'abra';
  h.setAttribute('data-brand', br);
  (function () { var sfx = br === 'abra' ? '' : '-' + br, a = document.querySelector('link[rel="icon"]'), b = document.querySelector('link[rel="apple-touch-icon"]'); if (a) a.href = 'icons/favicon' + sfx + '.png'; if (b) b.href = 'icons/apple-touch-icon' + sfx + '.png'; })();
  var th = p.theme || 'auto', dark = false;
  try { dark = th === 'dark' || (th === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { }
  h.setAttribute('data-theme', dark ? 'dark' : 'light');
  self.__splash = { name: NAME[p.brand] || 'Abra', tag: TAG[l], brand: NAME[p.brand] ? p.brand : 'abra' };
  document.title = self.__splash.name;
})();
</script>

<body>
<div id="splash" aria-hidden="true"><div class="sp-center"><div class="sp-logo"><img id="spLogo" src="icons/abra.svg" alt="" width="148" height="148"></div><div class="sp-name" id="spName">Abra</div><div class="sp-tag" id="spTag"></div></div></div>
<div id="app"></div>
<noscript>Abra needs JavaScript.</noscript>
<script>
/* Keep the opening screen up for a moment (so it can be enjoyed), then fade it out once the app is ready. */
(function () {
  var sn = document.getElementById('spName'), st = document.getElementById('spTag');
  if (sn && self.__splash) { sn.textContent = self.__splash.name; st.textContent = self.__splash.tag; document.getElementById('splash').setAttribute('data-brand', self.__splash.brand); var sl = document.getElementById('spLogo'); if (sl) sl.src = 'icons/' + self.__splash.brand + '.svg'; }
  var t0 = Date.now(), MIN = 2000, done = false, still = /[?&]still\b/.test(location.search), meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', '#1c1360');
  self.hideSplash = function () {
    if (done || still) return; done = true;
    setTimeout(function () {
      var el = document.getElementById('splash');
      document.dispatchEvent(new Event('abra:splash-end'));
      document.documentElement.classList.remove('splashing');
      if (!el) return;
      el.classList.add('out');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1200);
    }, Math.max(0, MIN - (Date.now() - t0)));
  };
  setTimeout(self.hideSplash, 7000); // never get stuck
})();
</script>
